<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล่องสุ่มพลังใจ</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f3e8ff, #fce7f3, #ede9fe); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: rgba(255, 255, 255, 0.95); max-width: 400px; width: 100%; padding: 40px 30px; border-radius: 32px; text-align: center; box-shadow: 0 15px 35px rgba(167, 139, 250, 0.18); }
        h1 { color: #8b5cf6; font-size: 26px; margin: 0 0 10px; }
        p { color: #6b5b73; font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        
        .gift-container { height: 120px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; font-size: 80px; user-select: none; }
        .gift-icon { display: inline-block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); }
        
        .wiggle { animation: wiggle 0.5s ease-in-out infinite; }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg) scale(1.1); }
            75% { transform: rotate(15deg) scale(1.1); }
        }

        .message-box { display: none; background: #fdf2f8; border: 2px dashed #d9468f; padding: 25px 20px; border-radius: 20px; color: #d9468f; font-size: 18px; font-weight: bold; margin-bottom: 25px; line-height: 1.5; opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .message-box.show { display: block; opacity: 1; transform: translateY(0); }
        
        /* เพิ่มสไตล์ให้ตัวการ์ตูนใหญ่ขึ้น */
        .char-icon { font-size: 50px; display: block; margin-bottom: 10px; }

        button { background: linear-gradient(135deg, #a78bfa, #ec4899); color: white; border: none; padding: 16px; border-radius: 20px; font-size: 17px; font-weight: bold; cursor: pointer; width: 100%; box-shadow: 0 8px 20px rgba(236, 72, 153, 0.22); transition: 0.3s; }
        button:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(236, 72, 153, 0.3); }
        button:active { transform: translateY(0); }
        
        .back-link { display: inline-block; margin-top: 25px; color: #8b5cf6; text-decoration: none; font-size: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h1>💌 กล่องสุ่มพลังใจ</h1>
        <p>กดปุ่มด้านล่างเพื่อรับคำพูดดี ๆ<br>สำหรับคุณในวันนี้</p>

        <div class="gift-container">
            <div id="gift" class="gift-icon">🎁</div>
        </div>

        <div id="message" class="message-box">
            <div id="charDisplay" class="char-icon"></div>
            <div id="textDisplay"></div>
        </div>

        <button id="drawBtn">รับคำพูดดี ๆ สำหรับวันนี้</button>
        <br>
        <a href="advice.html" class="back-link">กลับหน้ากิจกรรม</a>
    </div>

    <script>
        // เปลี่ยนรูปแบบเป็น { ข้อความ, ตัวการ์ตูน }
        const quotes = [
    { text: "คุณเก่งมากแล้วที่ผ่านวันนี้มาได้", char: "🥰" },
    { text: "อนุญาตให้ตัวเองพักบ้างนะ ร่างกายไม่ใช่เครื่องจักร", char: "☁️" },
    { text: "ความผิดพลาดคือส่วนหนึ่งของการเติบโต", char: "🌻" },
    { text: "ไม่ต้องสมบูรณ์แบบ แค่เป็นตัวเองในเวอร์ชันที่มีความสุขก็พอ", char: "🌈" },
    { text: "หายใจเข้าลึก ๆ ทุกอย่างจะค่อย ๆ ดีขึ้น", char: "🎈" },
    { text: "วันนี้อาจจะยาก แต่คุณจะผ่านมันไปได้เหมือนทุกครั้ง", char: "💖" },
    { text: "ไม่เป็นไรนะ ถ้ารู้สึกว่าวันนี้ยังทำได้ไม่ดีพอ พรุ่งนี้เอาใหม่", char: "✨" },
    { text: "อย่าลืมให้รางวัลตัวเองด้วยของอร่อยที่ชอบบ้างนะ", char: "🍰" }
];

        const btn = document.getElementById("drawBtn");
        const gift = document.getElementById("gift");
        const msgBox = document.getElementById("message");
        const charDisplay = document.getElementById("charDisplay");
        const textDisplay = document.getElementById("textDisplay");

        btn.addEventListener("click", () => {
            msgBox.classList.remove("show");
            gift.textContent = "🎁";
            gift.classList.add("wiggle");
            btn.disabled = true;

            setTimeout(() => {
                gift.classList.remove("wiggle");
                gift.textContent = "✨💌✨"; 
                
                // สุ่มคู่ข้อความและตัวการ์ตูน
                const randomItem = quotes[Math.floor(Math.random() * quotes.length)];
                charDisplay.innerHTML = randomItem.char;
                textDisplay.innerHTML = randomItem.text;
                
                msgBox.classList.add("show");
                btn.textContent = "สุ่มข้อความใหม่อีกครั้ง";
                btn.disabled = false;
            }, 800);
        });
    </script>
</body>
</html>
