<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กิจกรรมลดความเครียด</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f3e8ff, #fce7f3, #ede9fe);
            color: #4a3f55;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(167, 139, 250, 0.18);
            text-align: center;
        }

        .header-box {
            margin-bottom: 25px;
        }

        h1 {
            color: #8b5cf6;
            font-size: 24px;
            margin: 0 0 10px 0;
        }

        .subtitle {
            color: #6b5b73;
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
        }

        /* กล่องแนะนำตามระดับความเครียด */

        .recommend-box {
            background: linear-gradient(135deg, #faf5ff, #fdf2f8);
            border: 2px dashed #d8b4fe;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: bold;
            color: #d9468f;
            line-height: 1.6;
        }

        /* การ์ดกิจกรรม */

        .cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: white;
            border: 2px solid #f1e7f8;
            border-radius: 22px;
            padding: 20px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(167, 139, 250, 0.05);
        }

        .card:hover {
            border-color: #c084fc;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(167, 139, 250, 0.15);
        }

        .card .icon {
            font-size: 35px;
            background: linear-gradient(135deg, #f3e8ff, #fce7f3);
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            flex-shrink: 0;
        }

        .card-text h3 {
            margin: 0 0 5px 0;
            color: #a855f7;
            font-size: 18px;
        }

        .card-text p {
            margin: 0;
            font-size: 13px;
            color: #8a7b91;
            line-height: 1.4;
        }

        /* กล่องความรู้วิชาการ */

        .science-box {
            margin-top: 35px;
            text-align: left;
            background: #f8fafc;
            padding: 20px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
        }

        .science-box h4 {
            margin: 0 0 10px 0;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .science-box p {
            color: #64748b;
            margin: 0 0 10px 0;
            line-height: 1.6;
        }

        details {
            background: white;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
            color: #64748b;
            outline: none;
        }

        details p {
            margin-top: 10px;
            margin-bottom: 0;
            font-size: 13px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #8b5cf6;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        /* ==============================
           Modal รายละเอียดกิจกรรม
        ============================== */

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            max-width: 500px;
            width: 100%;
            border-radius: 32px;
            padding: 30px;
            position: relative;
            text-align: left;
            transform: translateY(20px);
            transition: transform 0.3s;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 24px;
            color: #a1a1aa;
            cursor: pointer;
            border: none;
            background: none;
        }

        .modal-header h2 {
            margin: 0 0 5px 0;
            color: #d9468f;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-right: 35px;
        }

        .tag-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 12px;
            background: #f3e8ff;
            color: #7c3aed;
            padding: 5px 12px;
            border-radius: 999px;
            font-weight: bold;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h4 {
            color: #4a3f55;
            margin: 0 0 8px 0;
            font-size: 16px;
        }

        .modal-section ul,
        .modal-section ol {
            margin: 0;
            padding-left: 20px;
            color: #6b5b73;
            font-size: 14.5px;
            line-height: 1.7;
        }

        /* ==============================
           ปุ่มกิจกรรม
        ============================== */

        .action-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(135deg, #a78bfa, #ec4899);
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.22);
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        /* ==============================
           QR POPUP
        ============================== */

        .qr-popup {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            display: none;

            justify-content: center;
            align-items: center;

            padding: 20px;

            background: rgba(70, 45, 90, 0.65);

            backdrop-filter: blur(5px);

            z-index: 9999;
        }

        .qr-popup.active {
            display: flex;
        }

        .qr-box {
            position: relative;

            width: 100%;
            max-width: 380px;

            background: white;

            border-radius: 30px;

            padding: 30px 20px;

            text-align: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);

            animation: qrPop 0.25s ease;
        }

        @keyframes qrPop {

            from {
                transform: scale(0.85);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }

        }

        .qr-title {
            color: #8b5cf6;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .qr-message {
            color: #6b5b73;
            font-size: 15px;
            line-height: 1.5;
            margin: 5px 0 18px;
        }

        .qr-box img {
            display: block;

            width: 230px;
            height: 230px;

            object-fit: contain;

            margin: 0 auto;

            background: white;

            padding: 10px;

            border: 3px solid #d8b4fe;

            border-radius: 22px;
        }

        .qr-hint {
            color: #9b7ab5;
            font-size: 13px;
            line-height: 1.5;
            margin-top: 18px;
            margin-bottom: 0;
        }

        .qr-close {
            position: absolute;

            top: 12px;
            right: 14px;

            width: 38px;
            height: 38px;

            border: none;

            border-radius: 50%;

            background: #f3e8ff;

            color: #8b5cf6;

            font-size: 25px;

            cursor: pointer;

            line-height: 35px;
        }

        .qr-close:hover {
            background: #e9d5ff;
        }

        @media (max-width: 480px) {

            body {
                padding: 20px 12px;
            }

            .container {
                padding: 28px 18px;
            }

            .card {
                padding: 16px;
            }

            .card .icon {
                width: 55px;
                height: 55px;
                font-size: 30px;
            }

            .card-text h3 {
                font-size: 16px;
            }

            .modal-content {
                padding: 25px 20px;
            }

            .qr-box {
                max-width: 340px;
            }

            .qr-box img {
                width: 210px;
                height: 210px;
            }
        }

    </style>
</head>

    <!-- ==============================
         Modal รายละเอียดกิจกรรม
    ============================== -->

    <div
        class="modal-overlay"
        id="modalOverlay"
        onclick="closeModal(event)"
    >

        <div
            class="modal-content"
            id="modalContent"
            onclick="event.stopPropagation()"
        >

            <button
                class="close-btn"
                onclick="closeModal()"
            >
                ✕
            </button>

            <div id="modalBody"></div>

        </div>

    </div>


    <!-- ==============================
         QR Popup
    ============================== -->

    <div
        id="qrPopup"
        class="qr-popup"
        onclick="closeQR(event)"
    >

        <div
            class="qr-box"
            onclick="event.stopPropagation()"
        >

            <button
                class="qr-close"
                onclick="closeQR()"
            >
                ×
            </button>

            <div class="qr-title">
                🤖 คุยกับเพื่อน AI
            </div>

            <p class="qr-message">
                📱 สแกน QR Code เพื่อคุยกับเพื่อน AI 💬
            </p>

            <img
                src="line-qr.png"
                alt="QR Code สำหรับคุยกับเพื่อน AI"
            >

            <p class="qr-hint">
                ✨ เปิดกล้องมือถือแล้วสแกน QR Code ได้เลย
            </p>

        </div>

    </div>

        /* ==========================================
           ตัวแปรกิจกรรมปัจจุบัน
        ========================================== */

        let currentActivities = [];


        /* ==========================================
           โหลดข้อมูลตามคะแนน
        ========================================== */

        window.onload = function () {

            const score =
                localStorage.getItem("stressScore");

            const recommendBox =
                document.getElementById("recommendation");

            const cardsContainer =
                document.getElementById("cardsContainer");


            let level = "low";


            if (score !== null) {

                const totalScore =
                    parseInt(score);


                if (totalScore <= 23) {

                    level = "low";

                } else if (totalScore <= 41) {

                    level = "medium";

                } else if (totalScore <= 61) {

                    level = "high";

                } else {

                    level = "severe";

                }

            }


            const data =
                activityDB[level];


            recommendBox.innerHTML =
                data.intro;


            currentActivities =
                data.activities;


            cardsContainer.innerHTML =
                currentActivities.map(
                    (act, index) => `

                    <div
                        class="card"
                        onclick="openModal(${index})"
                    >

                        <div class="icon">
                            ${act.icon}
                        </div>

                        <div class="card-text">

                            <h3>
                                ${act.title}
                            </h3>

                            <p>
                                ${act.subtitle}
                            </p>

                        </div>

                    </div>

                `
                ).join("");

        };


        /* ==========================================
           Modal
        ========================================== */

        const overlay =
            document.getElementById("modalOverlay");

        const modalBody =
            document.getElementById("modalBody");


        function openModal(index) {

            const data =
                currentActivities[index];


            let tagsHtml =
                data.tags
                    .map(
                        t =>
                            `<span class="tag">${t}</span>`
                    )
                    .join("");


            let stepsHtml =
                data.steps
                    .map(
                        s =>
                            `<li>${s}</li>`
                    )
                    .join("");


            let benefitsHtml =
                data.benefits
                    .map(
                        b =>
                            `<li>${b}</li>`
                    )
                    .join("");


            /* ==========================================
               สร้างปุ่ม
            ========================================== */

            let btnHtml = "";


            if (data.actionLink) {


                /* ถ้าเป็น QR Code */

                if (data.actionType === "qr") {

                    btnHtml = `

                        <button
                            class="action-btn"
                            type="button"
                            onclick="openQR()"
                        >

                            ${data.actionText}

                        </button>

                    `;


                } else {


                    /* ถ้าเป็นลิงก์ทั่วไป */

                    const isExternal =
                        data.actionLink.startsWith("http");


                    const targetAttr =
                        isExternal
                            ? 'target="_blank"'
                            : "";


                    btnHtml = `

                        <a
                            href="${data.actionLink}"
                            class="action-btn"
                            ${targetAttr}
                        >

                            ${data.actionText}

                        </a>

                    `;

                }

            }


            modalBody.innerHTML = `

                <div class="modal-header">

                    <h2>
                        ${data.title}
                    </h2>

                </div>


                <div class="tag-row">

                    ${tagsHtml}

                </div>


                <div class="modal-section">

                    <h4>
                        ${data.stepsTitle}
                    </h4>

                    <ol>

                        ${stepsHtml}

                    </ol>

                </div>


                <div class="modal-section">

                    <h4>
                        ${data.benefitsTitle}
                    </h4>

                    <ul
                        style="
                            list-style-type: none;
                            padding-left: 0;
                        "
                    >

                        ${benefitsHtml}

                    </ul>

                </div>


                ${btnHtml}

            `;


            overlay.classList.add("active");

            document.body.style.overflow =
                "hidden";

        }


        /* ==========================================
           ปิด Modal
        ========================================== */

        function closeModal(event) {

            if (
                event &&
                event.target !== overlay
            ) {

                return;

            }


            overlay.classList.remove("active");

            document.body.style.overflow =
                "auto";

        }


        /* ==========================================
           เปิด QR Popup
        ========================================== */

        function openQR() {

            const qrPopup =
                document.getElementById("qrPopup");


            qrPopup.classList.add("active");


            document.body.style.overflow =
                "hidden";

        }


        /* ==========================================
           ปิด QR Popup
        ========================================== */

        function closeQR(event) {

            const qrPopup =
                document.getElementById("qrPopup");


            if (
                event &&
                event.target !== qrPopup
            ) {

                return;

            }


            qrPopup.classList.remove("active");


            document.body.style.overflow =
                "auto";

        }


        /* ==========================================
           กด ESC เพื่อปิด
        ========================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Escape") {

                    document
                        .getElementById("qrPopup")
                        .classList.remove("active");


                    document
                        .getElementById("modalOverlay")
                        .classList.remove("active");


                    document.body.style.overflow =
                        "auto";

                }

            }
        );

    </script>


</div>
