<html lang="th">
<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #f3e8ff,
                #fce7f3,
                #ede9fe
            );
            color: #4a3f55;
            min-height: 100vh;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            padding: 35px 25px;
            border-radius: 32px;
            box-shadow: 0 15px 35px rgba(167,139,250,0.18);
            text-align: center;
        }

        .header-box {
            margin-bottom: 25px;
        }

        h1 {
            color: #8b5cf6;
            font-size: 24px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #6b5b73;
            font-size: 15px;
            margin: 0;
            line-height: 1.5;
        }

        .recommend-box {
            background: linear-gradient(
                135deg,
                #faf5ff,
                #fdf2f8
            );
            border: 2px dashed #d8b4fe;
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 25px;
            font-size: 15px;
            font-weight: bold;
            color: #d9468f;
            line-height: 1.6;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: white;
            border: 2px solid #f1e7f8;
            border-radius: 22px;
            padding: 20px;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(167,139,250,0.05);
        }

        .card:hover {
            border-color: #c084fc;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(167,139,250,0.15);
        }

        .card .icon {
            font-size: 35px;
            background: linear-gradient(
                135deg,
                #f3e8ff,
                #fce7f3
            );
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 18px;
            flex-shrink: 0;
        }

        .card-text h3 {
            margin: 0 0 5px;
            color: #a855f7;
            font-size: 18px;
        }

        .card-text p {
            margin: 0;
            font-size: 13px;
            color: #8a7b91;
            line-height: 1.4;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            color: #8b5cf6;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            max-width: 500px;
            width: 100%;
            border-radius: 32px;
            padding: 30px;
            position: relative;
            text-align: left;
            transform: translateY(20px);
            transition: transform 0.3s;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 25px;
            font-size: 24px;
            color: #a1a1aa;
            cursor: pointer;
            border: none;
            background: none;
        }

        .modal-header h2 {
            margin: 0 0 10px;
            color: #d9468f;
            padding-right: 35px;
        }

        .tag-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 12px;
            background: #f3e8ff;
            color: #7c3aed;
            padding: 5px 12px;
            border-radius: 999px;
            font-weight: bold;
        }

        .modal-section {
            margin-bottom: 20px;
        }

        .modal-section h4 {
            color: #4a3f55;
            margin: 0 0 8px;
            font-size: 16px;
        }

        .modal-section ul,
        .modal-section ol {
            margin: 0;
            padding-left: 20px;
            color: #6b5b73;
            font-size: 14.5px;
            line-height: 1.7;
        }

        /* =========================
           ปุ่มกิจกรรม
        ========================= */

        .action-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: linear-gradient(
                135deg,
                #a78bfa,
                #ec4899
            );
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(236,72,153,0.22);
            border: none;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: 0.2s;
        }

        .action-btn:hover {
            transform: translateY(-2px);
        }

        @media (max-width:480px) {

            body {
                padding: 20px 12px;
            }

            .container {
                padding: 28px 18px;
            }

            .card {
                padding: 16px;
            }

            .card .icon {
                width: 55px;
                height: 55px;
                font-size: 30px;
            }

            .card-text h3 {
                font-size: 16px;
            }

            .modal-content {
                padding: 25px 20px;
            }
        }
    </style>
</head>

/* =====================================================
   ตัวแปรกิจกรรมปัจจุบัน
===================================================== */

let currentActivities = [];


/* =====================================================
   โหลดผลประเมิน
===================================================== */

window.onload = function () {

    const score =
        localStorage.getItem("stressScore");

    const recommendBox =
        document.getElementById("recommendation");

    const cardsContainer =
        document.getElementById("cardsContainer");

    let level = "low";

    if (score !== null) {

        const totalScore =
            parseInt(score);

        if (totalScore <= 23) {

            level = "low";

        } else if (totalScore <= 41) {

            level = "medium";

        } else if (totalScore <= 61) {

            level = "high";

        } else {

            level = "severe";

        }
    }

    const data =
        activityDB[level];

    recommendBox.innerHTML =
        data.intro;

    currentActivities =
        data.activities;

    cardsContainer.innerHTML =
        currentActivities.map(
            (act,index) => `

                <div
                    class="card"
                    onclick="openModal(${index})"
                >

                    <div class="icon">
                        ${act.icon}
                    </div>

                    <div class="card-text">

                        <h3>
                            ${act.title}
                        </h3>

                        <p>
                            ${act.subtitle}
                        </p>

                    </div>

                </div>

            `
        ).join("");
};


/* =====================================================
   MODAL
===================================================== */

const overlay =
    document.getElementById("modalOverlay");

const modalBody =
    document.getElementById("modalBody");


function openModal(index) {

    const data =
        currentActivities[index];

    const tagsHtml =
        data.tags
            .map(
                t =>
                `<span class="tag">${t}</span>`
            )
            .join("");

    const stepsHtml =
        data.steps
            .map(
                s =>
                `<li>${s}</li>`
            )
            .join("");

    const benefitsHtml =
        data.benefits
            .map(
                b =>
                `<li>${b}</li>`
            )
            .join("");


    /* =================================================
       สร้างปุ่มกิจกรรม
       ไม่มี QR แล้ว
    ================================================= */

    let btnHtml = "";

    if (data.actionLink) {

        btnHtml = `

            <a
                href="${data.actionLink}"
                class="action-btn"
                target="_blank"
                rel="noopener noreferrer"
            >
                ${data.actionText}
            </a>

        `;
    }


    modalBody.innerHTML = `

        <div class="modal-header">

            <h2>
                ${data.icon}
                ${data.title}
            </h2>

        </div>

        <div class="tag-row">

            ${tagsHtml}

        </div>

        <div class="modal-section">

            <h4>
                ${data.stepsTitle}
            </h4>

            <ol>

                ${stepsHtml}

            </ol>

        </div>

        <div class="modal-section">

            <h4>
                ${data.benefitsTitle}
            </h4>

            <ul
                style="
                    list-style-type:none;
                    padding-left:0;
                "
            >

                ${benefitsHtml}

            </ul>

        </div>

        ${btnHtml}

    `;


    overlay.classList.add("active");

    document.body.style.overflow =
        "hidden";
}


/* =====================================================
   ปิด Modal
===================================================== */

function closeModal(event) {

    if (
        event &&
        event.target !== overlay
    ) {

        return;
    }

    overlay.classList.remove("active");

    document.body.style.overflow =
        "auto";
}


/* =====================================================
   กด ESC
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            overlay.classList.remove("active");

            document.body.style.overflow =
                "auto";
        }

    }
);

</script>
