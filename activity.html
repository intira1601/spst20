<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เปิดกิจกรรม | Nurse Care Buddy</title>
<link rel="stylesheet" href="activity-recording.css?v=3"><style>
*{box-sizing:border-box}body{margin:0;padding:36px 16px;font:17px/1.8 system-ui,Tahoma,sans-serif;color:#4a355f;background:linear-gradient(135deg,#f2eaff,#fff0f5);min-height:100vh}.launch{max-width:650px;background:white;margin:30px auto;padding:38px;border-radius:28px;box-shadow:0 12px 40px #8254aa12;text-align:center}h1{font-size:27px;line-height:1.5}.symbol{font-size:45px}.go{display:block;padding:15px;margin:25px 0;border-radius:16px;background:linear-gradient(110deg,#9b68d6,#e357a2);color:white;text-decoration:none;font-weight:700}a{color:#7952aa}.note{font-size:14px;color:#766580}[hidden]{display:none!important}
</style></head><body><main class="launch"><div class="symbol" aria-hidden="true">🌷</div><h1 id="activityTitle">เลือกกิจกรรม</h1><p id="description">ลิงก์กิจกรรมไม่ถูกต้อง กรุณากลับไปเลือกจากหน้ารวมกิจกรรม</p><a id="outgoing" class="go" target="_blank" rel="noopener noreferrer" data-activity-outbound hidden>ไปทำกิจกรรม</a><p class="note">นับเมื่อกดปุ่มไปเว็บไซต์ภายนอก ระบบนี้ไม่สามารถยืนยันว่าได้เริ่มหรือทำกิจกรรมในเว็บไซต์นั้นเสร็จแล้ว</p><a href="advice.html">ดูรายการกิจกรรม</a></main>
<script src="activity-catalog.js?v=3"></script><script>
(()=>{const code=new URLSearchParams(location.search).get('activity');const item=Object.hasOwn(ACTIVITY_CATALOG,code)?ACTIVITY_CATALOG[code]:null;if(!item?.url)return;document.title=item.name+' | Nurse Care Buddy';document.getElementById('activityTitle').textContent=item.name;document.getElementById('description').textContent='พร้อมเมื่อไหร่ กดปุ่มด้านล่างเพื่อเปิดกิจกรรมได้เลย';const a=document.getElementById('outgoing');a.href=item.url;a.hidden=false;})();
</script><script src="activity-telemetry.js?v=3"></script></body></html>
